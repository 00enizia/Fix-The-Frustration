<!DOCTYPE html>
<html>

<head>

<title>
Fix The Frustration
</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<!-- TEAM SCREEN -->

<div id="team-screen">


<h1>
🎨 Fix The Frustration
</h1>


<h2>
Student Portal Design Challenge
</h2>


<input 
id="team-name"
placeholder="Enter Group Name"
>


<button id="join">
Start Game
</button>


</div>





<header>

<h1>
🎮 Fix The Frustration
</h1>

<p>
Human-Centered Design Challenge
</p>

</header>





<div class="game-info">


<h2>
Mission
</h2>


<div id="scenario">

</div>


<div id="timer">
⏳ Time: 0
</div>


</div>






<main>


<!-- COMPONENT AREA -->

<section class="closet">


<h2>
🎒 Component Closet
</h2>


<div class="category">


<button data-category="profile">
👤 Profile
</button>


<button data-category="academic">
📚 Academic
</button>


<button data-category="communication">
🔔 Communication
</button>


<button data-category="system">
⚙ System
</button>


<button data-category="theme">
🎨 Theme
</button>


</div>



<div id="items">

</div>


</section>







<!-- WEBSITE -->

<section class="prototype">


<h2>
Website Prototype
</h2>



<div id="website">


<div 
class="drop-slot header-slot"
data-slot="header">

Header

</div>




<div class="website-body">



<div 
class="drop-slot sidebar-slot"
data-slot="sidebar">

Sidebar


</div>





<div 
class="drop-slot dashboard-slot"
data-slot="dashboard">


<h2 contenteditable="true">

Welcome Student!

</h2>


<p>
Drag components here
</p>


</div>



</div>





<div 
class="drop-slot footer-slot"
data-slot="footer">

Footer

</div>



</div>




<button id="test">
🧪 Test Design
</button>


</section>






<!-- LEADERBOARD -->


<section class="leaderboard">


<h2>
🏆 Leaderboard
</h2>


<div id="leaderboard">

</div>


</section>



</main>




<script type="module" src="script.js"></script>


</body>


</html>
