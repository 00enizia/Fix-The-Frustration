<!DOCTYPE html>
<html>

<head>

<title>
Fix The Frustration - Student Portal Designer
</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header>

<h1>
🎨 Fix The Frustration
</h1>

<p>
Student Portal Designer Challenge
</p>

</header>



<div id="editor">


<main>



<!-- COMPONENT CLOSET -->

<section class="closet">


<h2>
👜 Component Closet
</h2>


<p>
Choose elements to add
</p>



<div class="category-buttons">


<button 
class="category-button"
data-category="Profile">

👤 Profile

</button>



<button 
class="category-button"
data-category="Academic">

📚 Academic

</button>



<button 
class="category-button"
data-category="Communication">

🔔 Communication

</button>



<button 
class="category-button"
data-category="System">

⚙ System

</button>


</div>



<div id="inventory-items">


<p>
Select a category
</p>


</div>



</section>







<!-- WEBSITE BUILDER -->

<section class="designer">



<h2>
💻 Your Student Portal
</h2>



<div class="website-frame">


<div class="fake-navbar">


<h3>
🎓 Student Portal
</h3>


<div class="nav-links">

Home

Courses

Schedule

Profile

</div>


</div>





<div 
id="website-canvas"
class="website-canvas">


<p class="instruction">

Drag components here

</p>


</div>




<footer>

Student Portal Prototype

</footer>


</div>




<button 
id="finish-button">


✨ Finish Design

</button>



</section>




</main>


</div>







<!-- FINAL OUTPUT -->


<div 
id="final-preview">


</div>





<script type="module" src="script.js"></script>


</body>


</html>
