<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fix The Frustration</title>

    <link rel="stylesheet" href="style.css">
</head>


<body>


<header>

    <h1>🎨 Fix The Frustration</h1>
    <p>Student Portal Design Challenge</p>

</header>



<main class="game">


<!-- LEFT PANEL -->

<section class="panel">

<h2>Customize Portal</h2>


<button onclick="showCategory('profile')">
👤 Profile
</button>


<button onclick="showCategory('academic')">
📚 Academic
</button>


<button onclick="showCategory('communication')">
🔔 Communication
</button>


<button onclick="showCategory('system')">
⚙ System
</button>


<button onclick="showCategory('appearance')">
🎨 Appearance
</button>



<div id="choices">

<p>Select a category</p>

</div>


</section>





<!-- WEBSITE PREVIEW -->


<section class="portal-section">


<h2>Your Student Portal</h2>


<div id="portal">


<h1>
🎓 Student Portal
</h1>


<p>
Welcome back, Student!
</p>



<div id="features">


</div>


</div>


<button onclick="testPortal()">
🧪 Test Design
</button>


</section>



</main>





<section id="testing" class="testing hidden">


<h1>
🧪 User Testing
</h1>


<h3>
Evaluate the design:
</h3>


<p>
✔ Is information easy to find?
</p>


<p>
✔ Are important features included?
</p>


<p>
✔ Is the portal easy to understand?
</p>



<textarea placeholder="Give feedback here..."></textarea>


</section>



<script type="module" src="script.js"></script>


</body>


</html>
