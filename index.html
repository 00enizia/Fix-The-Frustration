<!DOCTYPE html>
<html>

<head>
    <title>Fix The Frustration</title>

    <link rel="stylesheet" href="style.css">
</head>


<body>

<header class="game-header">

    <h1>🎨 Fix The Frustration</h1>

    <p>Student Portal Designer Challenge</p>

</header>



<section class="mission-panel">

    <div>
        <h2>🎯 Mission</h2>

        <h3 id="problem-title">
            Loading problem...
        </h3>

        <p id="problem-description"></p>
    </div>


    <div class="game-info">

        <h3>
            ⏳ Time:
            <span id="timer">60</span>
        </h3>


        <h3>
            ⭐ Score:
            <span id="score">0</span>
        </h3>

    </div>

</section>




<main class="game-container">


<!-- COMPONENT INVENTORY -->

<section class="inventory">


<h2>
🎒 Component Closet
</h2>


<div id="category-buttons">


<button data-category="Profile">
👤 Profile
</button>


<button data-category="Academic">
📚 Academic
</button>


<button data-category="Communication">
🔔 Communication
</button>


<button data-category="System">
⚙ System
</button>


</div>



<div id="inventory-items">

</div>


</section>






<!-- WEBSITE BUILDER -->

<section class="website-area">


<h2>
💻 Website Prototype
</h2>



<div class="website-frame">


<div 
class="drop-zone header-zone"
id="header">


<h3>
HEADER
</h3>


</div>





<div class="middle-layout">


<div 
class="drop-zone sidebar-zone"
id="sidebar">


<h3>
SIDEBAR
</h3>


</div>




<div 
class="drop-zone main-zone"
id="main">


<h3>
MAIN DASHBOARD
</h3>


</div>


</div>





<div 
class="drop-zone footer-zone"
id="footer">


<h3>
FOOTER
</h3>


</div>


</div>




<button id="test-button">

🧪 Test Website

</button>



</section>






<!-- LEADERBOARD -->

<section class="leaderboard">


<h2>
🏆 Leaderboard
</h2>


<div>

Group 1 ⭐ <span>0</span>

</div>


<div>

Group 2 ⭐ <span>0</span>

</div>


<div>

Group 3 ⭐ <span>0</span>

</div>



</section>



</main>





<!-- RESULT MODAL -->


<div id="result-modal">


<div class="result-box">


<button id="close-result">
❌
</button>


<h1 id="result-title">

</h1>


<h2>

Score:
<span id="final-score">

</span>

</h2>



<div id="feedback">

</div>



<button id="retry-button">

🔄 Try Again

</button>



</div>


</div>




<script type="module" src="script.js"></script>


</body>


</html>
